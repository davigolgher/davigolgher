<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>humanproof - prova de humano</title>
<style>
  :root { --bg:#0e1116; --fg:#e6edf3; --dim:#8b949e; --ok:#3fb950; --bad:#f85149; --line:#30363d; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
         font:14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }

  /* A tela INTEIRA e a fonte de luz do desafio. Por isso o flash e um
     overlay de pagina cheia, e nao um quadradinho ao lado do video. */
  #flash { position:fixed; inset:0; background:#000; z-index:1;
           transition:none; }

  main { position:relative; z-index:2; max-width:760px; margin:0 auto;
         padding:24px 16px 48px; }
  h1 { font-size:18px; margin:0 0 2px; }
  .sub { color:var(--dim); margin:0 0 20px; }

  .stage { position:relative; width:480px; max-width:100%; margin:0 auto;
           border:1px solid var(--line); border-radius:12px; overflow:hidden;
           background:#000; }
  video { display:block; width:100%; transform:scaleX(-1); }
  #guide { position:absolute; inset:0; width:100%; height:100%; }

  .row { display:flex; gap:8px; align-items:center; justify-content:center;
         flex-wrap:wrap; margin:16px 0; }
  button { font:inherit; padding:9px 16px; border-radius:8px; cursor:pointer;
           border:1px solid var(--line); background:#21262d; color:var(--fg); }
  button.primary { background:#238636; border-color:#2ea043; font-weight:600; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  select { font:inherit; padding:8px; border-radius:8px; background:#21262d;
           color:var(--fg); border:1px solid var(--line); }

  #status { text-align:center; color:var(--dim); min-height:22px; }
  .verdict { font-size:22px; font-weight:700; text-align:center; margin:8px 0; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  ul { margin:8px 0; padding-left:20px; color:#ffa657; }
  pre { background:#161b22; border:1px solid var(--line); border-radius:8px;
        padding:12px; overflow-x:auto; font-size:12px; color:var(--dim); }
  .card { border:1px solid var(--line); border-radius:12px; padding:16px;
          margin-top:16px; background:#0d1117; }
  label { color:var(--dim); }
</style>
</head>
<body>
<div id="flash"></div>
<main>
  <h1>humanproof</h1>
  <p class="sub">Prova de presenca humana por desafio-resposta. Duas cabecas:
     pulso (rPPG) e resposta da pele ao flash.</p>

  <div class="stage">
    <video id="cam" playsinline muted autoplay></video>
    <svg id="guide" viewBox="0 0 100 100" preserveAspectRatio="none">
      <ellipse cx="50" cy="45" rx="23" ry="33" fill="none"
               stroke="#58a6ff" stroke-width="0.5" stroke-dasharray="2 2"/>
      <rect x="42" y="24" width="16" height="8" fill="none" stroke="#3fb950" stroke-width="0.4"/>
      <rect x="30" y="50" width="12" height="10" fill="none" stroke="#3fb950" stroke-width="0.4"/>
      <rect x="58" y="50" width="12" height="10" fill="none" stroke="#3fb950" stroke-width="0.4"/>
      <rect x="2"  y="2"  width="14" height="16" fill="none" stroke="#8b949e" stroke-width="0.4"/>
    </svg>
  </div>

  <div class="row">
    <label for="label">Gravar como:</label>
    <select id="label">
      <option value="real">real (voce, ao vivo)</option>
      <option value="replay">replay (tela reproduzindo video)</option>
      <option value="injection">injection (camera virtual / face-swap)</option>
    </select>
    <button id="start" class="primary" disabled>Iniciar desafio</button>
  </div>

  <div id="status">Liberando a camera...</div>
  <div id="out"></div>
</main>
<script src="/app.js"></script>
</body>
</html>
